site_name: Korfix Documentation
site_url: https://docs.korfix.info
site_description: Public documentation for the Korfix platform — ERP, miniapp marketplace, AI development SDK
site_author: Korfix

repo_url: https://github.com/korfixdev/docs
repo_name: korfixdev/docs
edit_uri: edit/main/

docs_dir: src

validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: info
  links:
    not_found: warn
    absolute_links: info
    unrecognized_links: info
    anchors: warn

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.instant
    - navigation.indexes
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - toc.follow
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - i18n:
      docs_structure: folder
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: ru
          name: Русский
          build: true
          nav_translations:
            Home: Главная
            Quick Start: Быстрый старт
            Update plugins: Обновить плагины
            Miniapps: Миниапы
            Overview: Обзор
            Getting started: Начало работы
            Rules: Правила
            First miniapp: Первое приложение
            Core API: Core API
            Config & entry points: Config и точки входа
            JS API (VMCRMUserApp): JS API (VMCRMUserApp)
            Data API: Data API
            Storage & hooks: Storage и хуки
            UI & Dashboards: UI и дашборды
            Styling: Стилизация
            Dashboards: Дашборды
            App architecture: Архитектура приложения
            Frame conventions: Конвенции фреймов
            Platform features: Фичи платформы
            Self-provisioning: Self-provisioning
            Catalog rules: Правила каталогов
            Catalog settings: Настройки каталогов
            DB views: DB views
            Catalog reference: Справочник каталогов
            All catalogs: Все каталоги
            Favorites menu: Меню избранного
            Push settings: Настройки push
            Help content: Контент справки
            Access statuses: Статусы доступа
            Bitrix24 sync: Синхронизация Bitrix24
            Release: Релиз
            Deploy: Деплой
            Checklist: Чеклист
            Messenger Apps: Приложения в мессенджере
            Build your first app: Первое приложение
            SDK & auth: SDK и авторизация
            Adapt a Telegram app: Адаптация Telegram-приложения
            Gamedev: Геймдев
            Game concepts: Концепции игр
            Game config: Конфиг игры
            Client API: Client API
            API Reference: Справочник API
            Recipes: Рецепты
            Walkthrough: Пошаговый пример
            Game styling: Стилизация игр
            Game checklist: Чеклист игры

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - Quick Start: quick-start.md
  - Update plugins: plugin-update.md
  - Miniapps:
    - Overview: miniapps/index.md
    - Getting started:
      - Rules: miniapps/rules.md
      - First miniapp: miniapps/getting-started.md
    - Core API:
      - Config & entry points: miniapps/config-json.md
      - JS API (VMCRMUserApp): miniapps/js-api.md
      - Data API: miniapps/data-api.md
      - Storage & hooks: miniapps/storage-and-hooks.md
    - UI & Dashboards:
      - Styling: miniapps/styling.md
      - Dashboards: miniapps/dashboards.md
    - App architecture:
      - Frame conventions: miniapps/frames.md
    - Platform features:
      - Self-provisioning: miniapps/self-provisioning.md
      - Catalog rules: miniapps/catalog-rules.md
      - Catalog settings: miniapps/catalog-settings.md
      - DB views: miniapps/db-views.md
    - Catalog reference:
      - All catalogs: miniapps/korfix-catalogs.md
      - Favorites menu: miniapps/favorites-menu.md
      - Push settings: miniapps/systempush-settings.md
      - Help content: miniapps/account-help.md
      - Access statuses: miniapps/access-statuses.md
      - Bitrix24 sync: miniapps/bitrix24-sync.md
    - Release:
      - Deploy: miniapps/deploy.md
      - Checklist: miniapps/checklist.md
  - Gamedev:
    - Overview: gamedev/index.md
    - Game concepts: gamedev/concepts.md
    - Game config: gamedev/config-korgames.md
    - Client API: gamedev/client-api.md
    - API Reference: gamedev/api-reference.md
    - Recipes: gamedev/recipes.md
    - Walkthrough: gamedev/coin-clicker-walkthrough.md
    - Game styling: gamedev/styling.md
    - Game checklist: gamedev/checklist.md
    - Project structure: gamedev/project-structure.md
  - Messenger Apps:
    - Overview: messenger-apps/index.md
    - Build your first app: messenger-apps/getting-started.md
    - SDK & auth: messenger-apps/sdk.md
    - Adapt a Telegram app: messenger-apps/telegram-compat.md

extra:
  alternate:
    - name: English
      link: /
      lang: en
    - name: Русский
      link: /ru/
      lang: ru
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/korfixdev
    - icon: fontawesome/solid/globe
      link: https://korfix.ru
  generator: false

